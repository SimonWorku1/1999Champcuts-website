# apphosting.yaml
# This file is automatically generated by the Firebase CLI.
# It will be overwritten the next time you run `firebase deploy`.

app_name: 1999Champcuts
regions:
  - us-west1

run_service:
  image: default
  ports:
    - port: 3000
env:
  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
